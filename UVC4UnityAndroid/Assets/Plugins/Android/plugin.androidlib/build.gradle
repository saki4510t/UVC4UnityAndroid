plugins {
	id "com.android.library"
	id "org.jetbrains.kotlin.android"
}

android {
	namespace = "com.serenegiant.unity.uvcplugin"

	defaultConfig {
		minSdk 26
		compileSdk = 35
		// ndkPath "**NDKPATH**"
		// ndkVersion "**NDKVERSION**"
		// lint.targetSdk **APIVERSION**
		// testOptions.targetSdk **APIVERSION**

		testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
		consumerProguardFiles("consumer-rules.pro")
		externalNativeBuild {
			cmake {
				arguments "-DANDROID_TOOLCHAIN=clang",
						  "-DANDROID_ARM_MODE=arm",
						  "-DANDROID_STL=c++_static",
						  "-DANDROID_CPP_FEATURES=rtti exceptions",
						  "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"	// MDKr27以降
				def flags = "-DANDROID_NDK"
				cFlags flags
				cppFlags flags
			}
		}

		ndk {
			abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
		}
	}

	buildTypes {
		release {
			minifyEnabled = false
			proguardFiles(
				getDefaultProguardFile("proguard-android-optimize.txt"),
				"proguard-rules.pro"
			)
		}
	}

	packaging {
		jniLibs {
//			keepDebugSymbols.add("**/*.so")
			// Unityのライブラリは除外
			exclude "**/libmain.so"
			exclude "**/libunity.so"
		}
	}

	externalNativeBuild {
		cmake {
			path("src/main/cpp/CMakeLists.txt")
			version = "3.22.1"
		}
	}

	compileOptions {
		sourceCompatibility = JavaVersion.VERSION_17
		targetCompatibility = JavaVersion.VERSION_17
	}

//	kotlinOptions.jvmTarget = "17"
}

dependencies {
	compileOnly fileTree(dir: "libs", "include": ["classes.jar"])
	// test
	testImplementation "junit:junit:4.13.2"
	androidTestImplementation "androidx.test.ext:junit:1.3.0"
	androidTestImplementation "androidx.test.espresso:espresso-core:3.7.0"
	// androidx
	implementation "androidx.core:core-ktx:1.13.0"
	implementation "androidx.appcompat:appcompat:1.7.1"
	// external
	implementation "com.serenegiant:common:9.16.0"
}
